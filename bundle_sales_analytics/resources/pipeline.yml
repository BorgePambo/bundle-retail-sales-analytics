resources:
  pipelines:
    sales_pipeline:
      name: sales_pipeline
      serverless: true
      continuous: false
      development: false
      catalog: ${var.catalog}
      schema: ${var.schema}
      allow_duplicate_names: true

      libraries:
        - file:
            path: ../src/transformations/bronze/sales_retails.sql
        - file:
            path: ../src/transformations/silver/sales_retails.sql
        - file:
            path: ../src/transformations/gold/dim_produto.sql
        - file:
            path: ../src/transformations/gold/dim_cliente.sql
        - file:
            path: ../src/transformations/gold/dim_localidade.sql
        - file:
            path: ../src/transformations/gold/dim_tempo.sql
        - file:
            path: ../src/transformations/gold/fct_vendas.sql

      configuration:
        bundle.sourcePath: ../src/transformations

      filters:
        include:
          - ../src/transformations/**

  jobs:
    ml_training_job:
      name: ml-training-purchase-propensity
      description: "Treina modelo de probabilidade de compra usando scikit-learn e MLflow"
      tags:
        project: retail_sales_analytics
        ml_task: classification
        model_type: purchase_propensity

      task_key: training
      new_cluster:
        spark_version: "3.5.0-scala2.12"
        node_type_id: "i3.xlarge"
        num_workers: 2
        spark_conf:
          spark.databricks.delta.frontend.preview.enabled: true
          spark.databricks.delta.retentionDurationCheck.enabled: false

      python_wheel:
        path: ../src/ml/requirements.txt

      python_task:
        notebook:
          path: ../src/ml/notebooks/ml_pipeline.ipynb
        parameters:
          catalog: ${var.catalog}
