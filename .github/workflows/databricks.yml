name: Databricks CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  contents: read

env:
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

defaults:
  run:
    working-directory: bundle_sales_analytics

jobs:

  # ============================================================
  # 1. TESTES
  # ============================================================
  test:
    name: Lint + Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        env:
          DATABRICKS_SKIP_CONNECT: "1"
        run: uv run pytest -v


  # ============================================================
  # 2. VALIDAÇÃO DO BUNDLE
  # ============================================================
  validate:
    name: Bundle Validate - PROD
    runs-on: ubuntu-latest
    needs: test

    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.8.0
        with:
          version: 1.1.0

      - name: Validate Bundle
        run: databricks bundle validate -t prod


  # ============================================================
  # 3. DEPLOY PROD
  # ============================================================
  deploy:
    name: Bundle Deploy - PROD
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: prod

    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.8.0
        with:
          version: 1.1.0

      - name: Deploy Bundle
        run: databricks bundle deploy -t prod

      - name: Bundle Summary
        run: databricks bundle summary -t prod